<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pour Manon ❤️</title><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@500;700&display=swap');*{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{font-family:'DM Sans',sans-serif;background:#3a0e1b;color:#f8ead8;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.14;background-image:radial-gradient(#e7b778 1px,transparent 1px);background-size:24px 24px}.wrap{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:28px 20px;position:relative;overflow:hidden}.glow{position:absolute;width:340px;height:340px;border-radius:50%;background:#8d263d;filter:blur(80px);opacity:.45;top:-100px;right:-100px}.glow2{position:absolute;width:260px;height:260px;border-radius:50%;background:#c47a3a;filter:blur(90px);opacity:.25;bottom:-80px;left:-80px}.card{position:relative;width:min(100%,520px);text-align:center;padding:48px 25px 42px;border:1px solid rgba(231,183,120,.32);border-radius:28px;background:rgba(49,9,22,.68);backdrop-filter:blur(8px);box-shadow:0 25px 70px #1e0710}.leaf{font-size:44px;margin-bottom:12px}h1{font-family:'Cormorant Garamond',serif;font-size:clamp(36px,10vw,62px);line-height:.9;margin:0 0 22px;color:#f3c98e;letter-spacing:-1px}.sub{font-family:'Cormorant Garamond',serif;font-size:22px;color:#e9cdb0;margin:0 auto 34px;max-width:380px}button{border:0;border-radius:999px;padding:16px 27px;background:#a52e4b;color:#fff5e9;font:700 15px 'DM Sans';box-shadow:0 10px 30px rgba(165,46,75,.35);cursor:pointer}.small{margin-top:20px;font-size:12px;color:#caa98e}</style></head><body><main class="wrap"><div class="glow"></div><div class="glow2"></div><section class="card"><div class="leaf">🍂</div><h1>JOYEUX ANNIVERSAIRE<br>MANONNN 💝</h1><p class="sub">Je t'aime.</p><button onclick
